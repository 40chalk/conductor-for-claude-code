# conductor: the grok sandbox profile of the repository {{repo}}: every conductor grok run
# there (write, read and review) runs under it (docs/DESIGN.md section 15.7). cx-run's grok lane
# and cx-init --user-grants write it; the lines between cx:begin and cx:end are rewritten when
# they differ, and any other [profiles.{{name}}] in this file is replaced (the name is
# conductor's own), so put your own profiles outside them, under other names. It extends grok's
# strict profile, which, as grok 1.0.70 applies it, reads the working directory, system paths
# and ~/.grok, and writes the working directory, ~/.grok/sessions, /tmp and /var/tmp, nothing
# else of ~/.grok (not its binary in bin/, its ripgrep in vendor/, installed-plugins/ or this
# file); no child network. It adds read-only access to the repository's git directory (git
# status in a worktree), to the conductor's routes directory (each run's cx-route; never the
# out directories, which hold other runs' tasks, diffs and digests) and to the directories
# outside strict's read set that hold this host's resolver and TLS files (on WSL
# /etc/resolv.conf links to /mnt/wsl/resolv.conf, which strict cannot read, so grok could
# resolve no host name; cx-doctor D17 lists them; none on most hosts). grok's own
# ~/.grok/sessions, which every grok run can read and write, still holds every grok session's
# transcript.
[profiles.{{name}}]
extends = "strict"
read_only = {{read_only}}
